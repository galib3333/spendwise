<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise — Expense Tracker</title>
<link rel="stylesheet" href="expense-tracker.css">
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <button class="hamburger" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>SpendWise</h1>
      <p>Smart expense tracking</p>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="navigate('dashboard')" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>
      <div class="nav-item" onclick="navigate('transactions')" data-page="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg>
        Transactions
      </div>
      <div class="nav-section">Analysis</div>
      <div class="nav-item" onclick="navigate('weekly')" data-page="weekly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Weekly Report
      </div>
      <div class="nav-item" onclick="navigate('monthly')" data-page="monthly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h7"/><path d="M16 2v4M8 2v4"/></svg>
        Monthly Report
      </div>
      <div class="nav-item" onclick="navigate('yearly')" data-page="yearly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Yearly Report
      </div>
      <div class="nav-section">Planning</div>
      <div class="nav-item" onclick="navigate('budgets')" data-page="budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Budgets
      </div>
      <div class="nav-item" onclick="navigate('recurring')" data-page="recurring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-8.36L1 10"/></svg>
        Recurring
      </div>
      <div class="nav-item" onclick="navigate('savings')" data-page="savings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        Savings Goals
      </div>
      <div class="nav-section">Tools</div>
      <div class="nav-item" onclick="navigate('export')" data-page="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Data
      </div>
      <div class="nav-item" onclick="navigate('settings')" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="flex flex-center gap-8" style="padding:0 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3)"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <div class="toggle" id="themeToggle" onclick="toggleTheme()"></div>
      </div>
    </div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="transactionModal">
  <div class="modal">
    <h3 id="modalTitle">Add Transaction</h3>
    <div class="input-group">
      <label>Type</label>
      <div class="tabs" id="typeTabs">
        <button class="tab active" onclick="setTransType('expense')">Expense</button>
        <button class="tab" onclick="setTransType('income')">Income</button>
      </div>
    </div>
    <div class="form-row">
      <div class="input-group">
        <label>Amount</label>
        <input type="number" class="input" id="txAmount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="input-group">
        <label>Date</label>
        <input type="date" class="input" id="txDate">
      </div>
    </div>
    <div class="form-row">
      <div class="input-group">
        <label>Category</label>
        <select class="input" id="txCategory"></select>
      </div>
      <div class="input-group">
        <label>Payment Method</label>
        <select class="input" id="txPayment">
          <option value="cash">Cash</option>
          <option value="card">Debit Card</option>
          <option value="credit">Credit Card</option>
          <option value="upi">UPI</option>
          <option value="bank">Bank Transfer</option>
          <option value="wallet">Digital Wallet</option>
        </select>
      </div>
    </div>
    <div class="input-group">
      <label>Description</label>
      <input type="text" class="input" id="txDesc" placeholder="What was this for?">
    </div>
    <div class="input-group">
      <label>Tags (comma separated)</label>
      <input type="text" class="input" id="txTags" placeholder="e.g. urgent, monthly">
    </div>
    <div class="input-group">
      <div class="flex flex-center gap-8">
        <input type="checkbox" id="txRecurring" style="accent-color:var(--accent)">
        <label for="txRecurring" style="margin:0;cursor:pointer">Recurring transaction</label>
      </div>
    </div>
    <div class="form-row hidden" id="recurringOptions">
      <div class="input-group">
        <label>Frequency</label>
        <select class="input" id="txFreq">
          <option value="weekly">Weekly</option>
          <option value="biweekly">Bi-Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
    </div>
    <input type="hidden" id="txId">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('transactionModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTransaction()" id="txSaveBtn">Save Transaction</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="budgetModal">
  <div class="modal">
    <h3>Set Budget</h3>
    <div class="input-group">
      <label>Category</label>
      <select class="input" id="budgetCategory"></select>
    </div>
    <div class="input-group">
      <label>Monthly Budget Limit</label>
      <input type="number" class="input" id="budgetAmount" placeholder="0.00" step="0.01" min="0">
    </div>
    <input type="hidden" id="budgetEditId">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('budgetModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBudget()">Save Budget</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="savingsModal">
  <div class="modal">
    <h3>Savings Goal</h3>
    <div class="input-group">
      <label>Goal Name</label>
      <input type="text" class="input" id="goalName" placeholder="e.g. Emergency Fund">
    </div>
    <div class="form-row">
      <div class="input-group">
        <label>Target Amount</label>
        <input type="number" class="input" id="goalTarget" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="input-group">
        <label>Current Saved</label>
        <input type="number" class="input" id="goalCurrent" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>
    <div class="input-group">
      <label>Target Date</label>
      <input type="date" class="input" id="goalDate">
    </div>
    <input type="hidden" id="goalEditId">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('savingsModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveGoal()">Save Goal</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="recurringModal">
  <div class="modal">
    <h3>Add Recurring Expense</h3>
    <div class="form-row">
      <div class="input-group">
        <label>Amount</label>
        <input type="number" class="input" id="recAmount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="input-group">
        <label>Frequency</label>
        <select class="input" id="recFreq">
          <option value="weekly">Weekly</option>
          <option value="biweekly">Bi-Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
    </div>
    <div class="input-group">
      <label>Category</label>
      <select class="input" id="recCategory"></select>
    </div>
    <div class="input-group">
      <label>Description</label>
      <input type="text" class="input" id="recDesc" placeholder="e.g. Netflix subscription">
    </div>
    <div class="form-row">
      <div class="input-group">
        <label>Start Date</label>
        <input type="date" class="input" id="recStart">
      </div>
      <div class="input-group">
        <label>Next Due Date</label>
        <input type="date" class="input" id="recNext">
      </div>
    </div>
    <input type="hidden" id="recEditId">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('recurringModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRecurring()">Save</button>
    </div>
  </div>
</div>

<script src="expense-tracker.js"></script>
</body>
</html>
